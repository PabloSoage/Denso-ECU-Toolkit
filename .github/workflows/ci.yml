name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The test suite covers viewer.core, which has no Qt dependency.
          pip install numpy pandas pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  syntax:
    # The Ghidra scripts run under Jython 2.7 inside Ghidra and cannot be
    # imported here, but they must at least parse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile everything
        run: python -m compileall -q Scripts viewer tests
